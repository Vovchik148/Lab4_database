{% extends "base.html" %}

{% block title %}Редагувати книгу{% endblock %}

{% block content %}

<div class="page-header">
    <h1>✏️ Редагування книги</h1>
</div>

<form method="POST" class="form-container">

    <label>Назва книги:</label>
    <input type="text" name="book_name" value="{{ book[1] }}" required>

    <label>Ціна (грн):</label>
    <input type="number" step="0.01" name="price" value="{{ book[4] }}" required>

    <label>Кількість на складі:</label>
    <input type="number" name="stock" value="{{ book[5] }}" required>

    <label>Автор:</label>
    <select name="author_id">
        {% for author in authors %}
        <option value="{{ author[0] }}" 
            {% if author[0] == book[6] %}selected{% endif %}>
            {{ author[1] }}
        </option>
        {% endfor %}
    </select>

    <label>Категорії:</label>
    <select name="categories" multiple>
        {% for cat in categories %}
        <option value="{{ cat[0] }}" 
            {% if cat[0] in current_categories %}selected{% endif %}>
            {{ cat[1] }}
        </option>
        {% endfor %}
    </select>

    <button class="btn btn-primary" type="submit">Зберегти</button>
</form>

{% endblock %}
