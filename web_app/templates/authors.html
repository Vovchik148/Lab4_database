{% extends "base.html" %}

{% block title %}Автори{% endblock %}

{% block content %}

<div class="page-header">
    <h1>👤 Автори</h1>
    <a href="{{ url_for('add_author') }}" class="btn btn-primary">+ Додати автора</a>
</div>

<div class="table-container">
    <table class="data-table">

        <thead>
        <tr>
            <th>ID</th>
            <th>Ім’я</th>
            <th>Рік народження</th>
            <th>Країна</th>
            <th></th>
        </tr>
        </thead>

        <tbody>
        {% for a in authors %}
        <tr>
            <td>{{ a[0] }}</td>
            <td>{{ a[1] }}</td>
            <td>{{ a[2] }}</td>
            <td>{{ a[3] }}</td>

            <td class="actions">
                <a href="{{ url_for('edit_author', author_id=a[0]) }}" class="btn btn-small btn-edit">✏️</a>
                <a href="{{ url_for('delete_author', author_id=a[0]) }}" class="btn btn-small btn-delete"
                   onclick="return confirm('Видалити автора?')">🗑️</a>
            </td>
        </tr>
        {% endfor %}
        </tbody>

    </table>
</div>

{% endblock %}
