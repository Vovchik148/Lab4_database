{% extends "base.html" %}

{% block title %}Додати книгу{% endblock %}

{% block content %}

<div class="page-header">
    <h1>➕ Додати нову книгу</h1>
</div>

<form method="POST" class="form-container">

    <label>Назва книги:</label>
    <input type="text" name="book_name" required>

    <label>ISBN:</label>
    <input type="text" name="isbn" required>

    <label>Рік видання:</label>
    <input type="number" name="year" required>

    <label>Ціна (грн):</label>
    <input type="number" step="0.01" name="price" required>

    <label>Кількість на складі:</label>
    <input type="number" name="stock" required>

    <label>Автор:</label>
    <select name="author_id" required>
        {% for author in authors %}
        <option value="{{ author[0] }}">{{ author[1] }}</option>
        {% endfor %}
    </select>

    <label>Категорії:</label>
    <select name="categories" multiple>
        {% for cat in categories %}
        <option value="{{ cat[0] }}">{{ cat[1] }}</option>
        {% endfor %}
    </select>

    <button class="btn btn-primary" type="submit">Додати</button>
</form>

{% endblock %}
