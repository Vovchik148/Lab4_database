{% extends "base.html" %}

{% block title %}Редагувати категорію{% endblock %}

{% block content %}

<div class="page-header">
    <h1>✏️ Редагування категорії</h1>
</div>

<form method="POST" class="form-container">

    <label>Назва категорії:</label>
    <input name="category_name" value="{{ category[1] }}" required>

    <button class="btn btn-primary">Зберегти</button>
</form>

{% endblock %}
