{% extends "base.html" %}

{% block title %}Панель керування{% endblock %}

{% block content %}
<div class="page-header">
    <h1>📊 Панель керування</h1>
</div>

<div class="stats-cards">

    <div class="stat-card">
        <h2>{{ counts.books }}</h2>
        <p>Книг</p>
    </div>

    <div class="stat-card">
        <h2>{{ counts.authors }}</h2>
        <p>Авторів</p>
    </div>

    <div class="stat-card">
        <h2>{{ counts.categories }}</h2>
        <p>Категорій</p>
    </div>

</div>

<p>Оберіть розділ у меню для подальшої роботи.</p>

{% endblock %}
