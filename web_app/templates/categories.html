{% extends "base.html" %}

{% block title %}Категорії{% endblock %}

{% block content %}

<div class="page-header">
    <h1>🏷 Категорії</h1>
    <a href="{{ url_for('add_category') }}" class="btn btn-primary">+ Додати категорію</a>
</div>

<div class="table-container">
    <table class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Назва</th>
            <th></th>
        </tr>
        </thead>

        <tbody>
        {% for c in categories %}
        <tr>
            <td>{{ c[0] }}</td>
            <td>{{ c[1] }}</td>

            <td class="actions">
                <a href="{{ url_for('edit_category', category_id=c[0]) }}" class="btn btn-small btn-edit">✏️</a>
                <a href="{{ url_for('delete_category', category_id=c[0]) }}"
                   class="btn btn-small btn-delete"
                   onclick="return confirm('Видалити категорію?')">🗑️</a>
            </td>
        </tr>
        {% endfor %}
        </tbody>

    </table>
</div>

{% endblock %}
